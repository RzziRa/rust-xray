[package]
name = "rust-xray"
version = "0.1.0"
edition = "2021"
default-run = "rust-xray"

[[bin]]
name = "rust-xray"
path = "src/main.rs"

[[bin]]
name = "xray"
path = "src/bin/xray.rs"

[features]
default = []

[build-dependencies]
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[dependencies]
aead = "0.5.2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.23"
bytes = "1.12"
h2 = "0.4"
http = "1"
hkdf = "0.13"
hmac = "0.13"
ml-dsa = "0.1"
ml-kem = { version = "0.3.2", default-features = false, features = ["getrandom", "zeroize"] }
rustls-pki-types = "1.8.0"
rustls = { version = "0.23.13", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["std", "serde", "v5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "3.0", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1.9", features = ["derive"] }
rcgen = "0.14"
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8"] }
getrandom = "0.4"
subtle = "2"
tonic = { version = "0.14", features = ["transport", "_tls-any"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-reflection = "0.14"
tokio-stream = "0.1"
tracing-appender = "0.2"
async-trait = "0.1"
regex = "1.13"
rand = "0.10"
blake3 = "1.5"
aes = "0.9"
ctr = "0.10"
clap = { version = "4.6", features = ["derive"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
prost-types = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
